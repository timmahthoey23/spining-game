<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d1117;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 70px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #5865f2;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .logo h1 {
            font-size: 20px;
        }

        .online {
            color: #3fb950;
            font-size: 14px;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            max-width: 75%;
        }

        .message-top {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .username {
            font-weight: bold;
            color: #ffffff;
        }

        .time {
            color: #8b949e;
            font-size: 11px;
        }

        .text {
            color: #c9d1d9;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .chat-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .input-area {
            padding: 15px 20px 20px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }

        .input-box {
            display: flex;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
            align-items: center;
        }

        .file-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 16px;
        }

        .file-btn:hover {
            background: #30363d;
        }

        #messageInput {
            flex: 1;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #5865f2;
        }

        #sendButton {
            border: none;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 14px 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #sendButton:hover {
            background: #4752c4;
        }

        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .image-preview-bar img {
            height: 40px;
            border-radius: 4px;
        }

        .remove-img {
            color: #f85149;
            cursor: pointer;
            font-weight: bold;
        }

        /* MODAL OVERLAYS */
        .modal-screen {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #passwordScreen {
            z-index: 101;
        }

        #usernameScreen {
            z-index: 100;
        }

        .modal-card {
            width: 100%;
            max-width: 430px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-card h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
        }

        .modal-input:focus {
            border-color: #5865f2;
        }

        .modal-btn {
            width: 100%;
            border: none;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-btn:hover {
            background: #4752c4;
        }

        .error {
            color: #f85149;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">💬</div>
            <div>
                <h1>Global Chat</h1>
            </div>
        </div>
        <div id="connectionStatus" class="online">
            ● Connecting...
        </div>
    </header>

    <main class="chat">
        <div id="messages" class="messages"></div>

        <div class="input-area">
            <div id="previewBar" class="image-preview-bar">
                <img id="imgPreview" src="" alt="Preview">
                <span>Image attached</span>
                <span id="removeImg" class="remove-img">✖</span>
            </div>

            <form id="messageForm" class="input-box">
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
                <button type="button" id="uploadBtn" class="file-btn">📷</button>

                <input
                    id="messageInput"
                    type="text"
                    maxlength="500"
                    placeholder="Type a message or paste an image..."
                    autocomplete="off"
                >

                <button id="sendButton" type="submit">Send</button>
            </form>
        </div>
    </main>

</div>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen" class="modal-screen">
    <div class="modal-card">
        <h2>🔒 Access Restricted</h2>
        <p>Enter the passcode to enter Global Chat.</p>

        <input
            id="passwordInput"
            class="modal-input"
            type="password"
            placeholder="Enter site passcode..."
            autocomplete="off"
        >

        <button id="passwordButton" class="modal-btn">Unlock Chat</button>

        <div id="passwordError" class="error">
            Incorrect passcode. Try again.
        </div>
    </div>
</div>

<!-- USERNAME SCREEN -->
<div id="usernameScreen" class="modal-screen">
    <div class="modal-card">
        <h2>Welcome 👋</h2>
        <p>Choose a username and optional profile photo link to enter.</p>

        <input
            id="usernameInput"
            class="modal-input"
            type="text"
            maxlength="20"
            placeholder="Enter username..."
            autocomplete="off"
        >

        <input
            id="avatarInput"
            class="modal-input"
            type="text"
            placeholder="Profile Picture URL (optional)..."
            autocomplete="off"
        >

        <button id="usernameButton" class="modal-btn">Enter Chat</button>

        <div id="usernameError" class="error">
            Please enter a username.
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        query,
        orderByChild,
        limitToLast,
        onChildAdded
    }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByPBJqGxTb75hD9Gd6p0iTjCxncHifsMI",
      authDomain: "spinnertest-57155.firebaseapp.com",
      databaseURL: "https://spinnertest-57155-default-rtdb.firebaseio.com",
      projectId: "spinnertest-57155",
      storageBucket: "spinnertest-57155.firebasestorage.app",
      messagingSenderId: "715577503355",
      appId: "1:715577503355:web:05b677f1b551c070b87cde",
      measurementId: "G-ZSXCZH5SCE"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const messagesRef = ref(database, "messages");

    // SHA-256 HASH OF "1234"
    const TARGET_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

    const passwordScreen = document.getElementById("passwordScreen");
    const passwordInput = document.getElementById("passwordInput");
    const passwordButton = document.getElementById("passwordButton");
    const passwordError = document.getElementById("passwordError");

    const usernameScreen = document.getElementById("usernameScreen");
    const usernameInput = document.getElementById("usernameInput");
    const avatarInput = document.getElementById("avatarInput");
    const usernameButton = document.getElementById("usernameButton");
    const usernameError = document.getElementById("usernameError");

    let username = localStorage.getItem("chatUsername");
    let userAvatar = localStorage.getItem("chatAvatar");
    let attachedImageBase64 = null;

    // PASSWORD VERIFICATION
    passwordButton.addEventListener("click", checkPassword);
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") checkPassword(); });

    async function hashInput(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPassword() {
        const inputVal = passwordInput.value;
        const inputHash = await hashInput(inputVal);

        if (inputHash === TARGET_HASH) {
            passwordScreen.style.display = "none";
            if (!username) {
                usernameScreen.style.display = "flex";
            }
        } else {
            passwordError.style.display = "block";
        }
    }

    if (username) {
        usernameScreen.style.display = "none";
    }

    usernameButton.addEventListener("click", setUsername);
    usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") setUsername(); });

    function setUsername() {
        const name = usernameInput.value.trim();
        const avatar = avatarInput.value.trim();

        if (!name) {
            usernameError.style.display = "block";
            return;
        }

        username = name.substring(0, 20);
        userAvatar = avatar || "";

        localStorage.setItem("chatUsername", username);
        localStorage.setItem("chatAvatar", userAvatar);

        usernameScreen.style.display = "none";
    }

    const messages = document.getElementById("messages");
    const connectionStatus = document.getElementById("connectionStatus");
    const messageInput = document.getElementById("messageInput");
    const messageForm = document.getElementById("messageForm");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const previewBar = document.getElementById("previewBar");
    const imgPreview = document.getElementById("imgPreview");
    const removeImg = document.getElementById("removeImg");

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) convertFileToBase64(file);
    });

    messageInput.addEventListener("paste", (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.type.indexOf("image") === 0) {
                const blob = item.getAsFile();
                convertFileToBase64(blob);
            }
        }
    });

    function convertFileToBase64(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            attachedImageBase64 = e.target.result;
            imgPreview.src = attachedImageBase64;
            previewBar.style.display = "flex";
        };
        reader.readAsDataURL(file);
    }

    removeImg.addEventListener("click", () => {
        attachedImageBase64 = null;
        previewBar.style.display = "none";
        fileInput.value = "";
    });

    messageForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const text = messageInput.value.trim();
        if (!text && !attachedImageBase64) return;
        if (!username) return alert("Choose a username first.");

        try {
            await push(messagesRef, {
                username: username,
                avatar: userAvatar || "",
                message: text,
                image: attachedImageBase64 || "",
                timestamp: Date.now()
            });

            messageInput.value = "";
            attachedImageBase64 = null;
            previewBar.style.display = "none";
            fileInput.value = "";
            messageInput.focus();

        } catch (error) {
            console.error(error);
            alert("Message could not be sent. Check your Firebase settings.");
        }
    });

    const recentMessages = query(
        messagesRef,
        orderByChild("timestamp"),
        limitToLast(100)
    );

    onChildAdded(
        recentMessages,
        function(snapshot) {
            connectionStatus.textContent = "● Connected";
            connectionStatus.style.color = "#3fb950";
            displayMessage(snapshot.val());
        },
        function(error) {
            console.error("Firebase error:", error);
            connectionStatus.textContent = "● Database error";
            connectionStatus.style.color = "#f85149";
        }
    );

    function displayMessage(data) {
        const message = document.createElement("div");
        message.className = "message";

        const avatar = document.createElement("div");
        avatar.className = "avatar";

        if (data.avatar) {
            const img = document.createElement("img");
            img.src = data.avatar;
            avatar.appendChild(img);
        } else {
            avatar.textContent = (data.username || "U").charAt(0).toUpperCase();
        }

        const content = document.createElement("div");
        content.className = "message-content";

        const top = document.createElement("div");
        top.className = "message-top";

        const name = document.createElement("span");
        name.className = "username";
        name.textContent = data.username;

        const time = document.createElement("span");
        time.className = "time";
        time.textContent = new Date(data.timestamp).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

        top.appendChild(name);
        top.appendChild(time);
        content.appendChild(top);

        if (data.message) {
            const text = document.createElement("div");
            text.className = "text";
            text.textContent = data.message;
            content.appendChild(text);
        }

        if (data.image) {
            const img = document.createElement("img");
            img.src = data.image;
            img.className = "chat-image";
            content.appendChild(img);
        }

        message.appendChild(avatar);
        message.appendChild(content);

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
