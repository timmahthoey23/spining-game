<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d1117;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #5865f2;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .logo h1 {
            font-size: 20px;
        }

        .online {
            color: #3fb950;
            font-size: 14px;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
        }

        .message-content {
            max-width: 75%;
        }

        .message-top {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .username {
            font-weight: bold;
            color: #ffffff;
        }

        .time {
            color: #8b949e;
            font-size: 11px;
        }

        .text {
            color: #c9d1d9;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            padding: 15px 20px 20px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }

        .input-box {
            display: flex;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

        #messageInput {
            flex: 1;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #5865f2;
        }

        #sendButton {
            border: none;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 0 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #sendButton:hover {
            background: #4752c4;
        }

        #sendButton:active {
            transform: scale(0.97);
        }

        /* =========================
           USERNAME SCREEN
        ========================= */

        .username-screen {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .username-card {
            width: 100%;
            max-width: 430px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .username-card h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .username-card p {
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        #usernameInput {
            width: 100%;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }

        #usernameInput:focus {
            border-color: #5865f2;
        }

        #usernameButton {
            width: 100%;
            border: none;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #usernameButton:hover {
            background: #4752c4;
        }

        .error {
            color: #f85149;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* =========================
           SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 0 15px;
            }

            .logo h1 {
                font-size: 17px;
            }

            .messages {
                padding: 15px;
            }

            .message-content {
                max-width: 85%;
            }

            .input-area {
                padding: 10px;
            }

            #sendButton {
                padding: 0 16px;
            }

            .username-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <div class="logo-icon">💬</div>

            <div>
                <h1>Global Chat</h1>
            </div>
        </div>

        <div class="online">
            ● Online
        </div>

    </header>


    <!-- CHAT -->
    <main class="chat">

        <div id="messages" class="messages">
            <!-- Messages appear here -->
        </div>

        <div class="input-area">

            <form id="messageForm" class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    maxlength="500"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button id="sendButton" type="submit">
                    Send
                </button>

            </form>

        </div>

    </main>

</div>


<!-- USERNAME SCREEN -->

<div id="usernameScreen" class="username-screen">

    <div class="username-card">

        <h2>Welcome 👋</h2>

        <p>
            Choose a username to join the chat.
            You don't need to create an account.
            Your username will be remembered on this device.
        </p>

        <input
            id="usernameInput"
            type="text"
            maxlength="20"
            placeholder="Enter username..."
            autocomplete="off"
        >

        <button id="usernameButton">
            Enter Chat
        </button>

        <div id="usernameError" class="error">
            Please enter a username.
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    /*
    ==========================================================
    FIREBASE CONFIG
    ==========================================================

    REPLACE THESE VALUES WITH YOUR FIREBASE PROJECT DETAILS.
    ==========================================================
    */

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        query,
        orderByChild,
        limitToLast,
        onChildAdded
    }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyByPBJqGxTb75hD9Gd6p0iTjCxncHifsMI",
  authDomain: "spinnertest-57155.firebaseapp.com",
  projectId: "spinnertest-57155",
  storageBucket: "spinnertest-57155.firebasestorage.app",
  messagingSenderId: "715577503355",
  appId: "1:715577503355:web:05b677f1b551c070b87cde",
  measurementId: "G-ZSXCZH5SCE"
};


    /*
    ==========================================================
    START FIREBASE
    ==========================================================
    */

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    /*
    ==========================================================
    USERNAME
    ==========================================================
    */

    const usernameScreen =
        document.getElementById("usernameScreen");

    const usernameInput =
        document.getElementById("usernameInput");

    const usernameButton =
        document.getElementById("usernameButton");

    const usernameError =
        document.getElementById("usernameError");


    let username =
        localStorage.getItem("chatUsername");


    /*
    If username already exists,
    skip username screen.
    */

    if (username) {

        usernameScreen.style.display = "none";

    }


    usernameButton.addEventListener("click", setUsername);


    usernameInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            setUsername();

        }

    });


    function setUsername() {

        const name =
            usernameInput.value.trim();


        if (!name) {

            usernameError.style.display = "block";

            return;

        }


        if (name.length < 2) {

            usernameError.textContent =
                "Username must be at least 2 characters.";

            usernameError.style.display = "block";

            return;

        }


        username =
            name.substring(0, 20);


        localStorage.setItem(
            "chatUsername",
            username
        );


        usernameScreen.style.display = "none";

    }


    /*
    ==========================================================
    CHAT ELEMENTS
    ==========================================================
    */

    const messages =
        document.getElementById("messages");

    const messageInput =
        document.getElementById("messageInput");

    const messageForm =
        document.getElementById("messageForm");


    /*
    ==========================================================
    SEND MESSAGE
    ==========================================================
    */

    messageForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const text =
            messageInput.value.trim();


        if (!text) return;


        if (!username) {

            alert("Choose a username first.");

            return;

        }


        try {

            await push(messagesRef, {

                username: username,

                message: text,

                timestamp: Date.now()

            });


            messageInput.value = "";

            messageInput.focus();

        }

        catch (error) {

            console.error(error);

            alert(
                "Message could not be sent. Check your Firebase settings."
            );

        }

    });


    /*
    ==========================================================
    RECEIVE MESSAGES
    ==========================================================
    */

    const recentMessages =
        query(
            messagesRef,
            orderByChild("timestamp"),
            limitToLast(100)
        );


    onChildAdded(
        recentMessages,
        function(snapshot) {

            const data =
                snapshot.val();


            displayMessage(data);

        },
        function(error) {

            console.error(
                "Firebase error:",
                error
            );

        }
    );


    /*
    ==========================================================
    DISPLAY MESSAGE
    ==========================================================
    */

    function displayMessage(data) {

        const message =
            document.createElement("div");

        message.className = "message";


        const avatar =
            document.createElement("div");

        avatar.className = "avatar";


        avatar.textContent =
            data.username
                .charAt(0)
                .toUpperCase();


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const top =
            document.createElement("div");

        top.className =
            "message-top";


        const name =
            document.createElement("span");

        name.className =
            "username";

        name.textContent =
            data.username;


        const time =
            document.createElement("span");

        time.className =
            "time";


        const date =
            new Date(data.timestamp);


        time.textContent =
            date.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });


        const text =
            document.createElement("div");

        text.className =
            "text";


        /*
        textContent is used instead of innerHTML
        so users cannot inject HTML into messages.
        */

        text.textContent =
            data.message;


        top.appendChild(name);

        top.appendChild(time);

        content.appendChild(top);

        content.appendChild(text);

        message.appendChild(avatar);

        message.appendChild(content);


        messages.appendChild(message);


        messages.scrollTop =
            messages.scrollHeight;

    }

</script>

</body>
</html>
